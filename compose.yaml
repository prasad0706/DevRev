services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb+srv://<username>:<password>@cluster0.mongodb.net/devreview_db?retryWrites=true&w=majority
      - JWT_SECRET=your_super_secret_jwt_key_123

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend